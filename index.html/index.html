<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>วงล้อสุ่มชื่อ - Wheel of Names</title>
<meta name="description" content="แอปวงล้อสุ่มชื่อ เพิ่มชื่อ หมุนวงล้อ และสุ่มผู้โชคดี ใช้งานได้แบบออฟไลน์" />
<meta name="theme-color" content="#4D96FF" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>🎡 วงล้อสุ่มชื่อ</h1>
      <p>เพิ่มชื่อ แล้วหมุนวงล้อเพื่อสุ่มผู้โชคดี</p>
      <button id="installBtn" class="spin-btn" style="padding:8px 18px;font-size:0.85rem;">📲 ติดตั้งแอป</button>
    </header>

    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheelCanvas"></canvas>
      <div class="hub">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" fill="#FFD93D"/>
        </svg>
      </div>
    </div>

    <button id="spinBtn" class="spin-btn">🎯 หมุนวงล้อ</button>

    <div class="panel">
      <h2>รายชื่อ</h2>
      <div class="add-row">
        <input id="nameInput" type="text" placeholder="พิมพ์ชื่อแล้วกด Enter หรือ +" />
        <button id="addBtn">+ เพิ่ม</button>
      </div>
      <p class="bulk-hint">เคล็ดลับ: พิมพ์หลายชื่อคั่นด้วยจุลภาค (,) เพื่อเพิ่มทีเดียว</p>

      <ul id="namesList" class="names-list"></ul>
      <p id="emptyMsg" class="empty-msg" style="display:none;">ยังไม่มีชื่อ เพิ่มอย่างน้อย 2 ชื่อเพื่อเริ่มหมุน</p>

      <div class="panel-footer">
        <span id="countLabel">ทั้งหมด 0 ชื่อ</span>
        <button id="clearAllBtn">ลบทั้งหมด</button>
      </div>
    </div>

    <footer class="credit">ทำงานได้แบบออฟไลน์ • ติดตั้งลงหน้าจอโฮมได้ (PWA)</footer>
  </div>

  <!-- Winner Modal -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
      <div class="trophy">🎉</div>
      <h3>ผู้โชคดีคือ</h3>
      <div class="winner-name" id="winnerName">-</div>
      <div class="modal-actions">
        <button id="keepBtn" class="btn-keep">เก็บไว้</button>
        <button id="removeBtn" class="btn-remove">ลบชื่อออก</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
